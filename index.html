<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1a0e" />
    <meta name="description" content="Laboratorio alchemico di Fenrhold — D&D 5e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>Fenrhold — Laboratorio Alchemico</title>
    <style>

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0c1a0e; }
      ::-webkit-scrollbar-thumb { background: #2a4a2e; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
